name: deviq
description: "DevIQ — developer intelligence and analytics platform. GitHub, LeetCode and Codeforces unified into a single developer score."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.8.0

  # Storage (secure for tokens, plain for prefs)
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Routing
  go_router: ^14.8.1

  # Charts / code highlighting / typography
  fl_chart: ^0.69.0
  flutter_highlight: ^0.7.0
  google_fonts: ^6.2.1

  # Utilities
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  simple_icons: ^16.23.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/logos/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/deviq-logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/deviq-logo.png"
  web:
    generate: true
    image_path: "assets/icon/deviq-logo.png"
    background_color: "#000000"
    theme_color: "#000000"
